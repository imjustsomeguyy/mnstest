<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>M&S Barcode Generator</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #1a1f1c;
      color: #dfeee0;
      margin: 0;
      padding: 1rem;
      text-align: center;
      transition: background 3.0s, color 2.5s;
    }

    .container {
      background: #222827;
      color: #dfeee0;
      padding: 1.5rem;
      border-radius: 1rem;
      max-width: 450px;
      margin: auto;
      box-shadow: 0 20px rgba(0,0,0,0.5);
    }

    img {
      max-width: 100%;
      height: auto;
      filter: brightness(1.2);
      transition: filter 0.5s;
    }

    body.light-mode img {
      filter: brightness(0.3) saturate(1.5);
    }

    input, button {
      padding: 0.6rem;
      margin: 0.5rem 0;
      font-size: 0.8rem;
      border-radius: 0.5rem;
      border: none;
    }

    input[type="text"], input[type="number"] {
      width: calc(100% - 1rem);
    }

    button.price-button {
      background: #68b06a;
      color: #ffffff;
      margin: 0.3rem;
      cursor: pointer;
      transition: background 0.2s;
    }

    button.price-button:hover {
      background: #4f9a52;
    }

    .barcode-frame {
      background: #e6efe7;
      padding: 1rem;
      border-radius: 0.8rem;
      margin-top: 1rem;
    }

    .barcode-label {
      font-size: 0.9rem;
      margin-bottom: 0.3rem;
      color: #1f2b21;
      font-weight: bold;
    }

    canvas {
      max-width: 100%;
    }

    .watermark {
      color: #6b7c6e;
      margin-top: 0.5rem;
    }

    .dark-mode-toggle {
      background: #2a2f2d;
      color: #cfe8d1;
      border: 1px solid #555;
      margin-top: 1rem;
    }

    body.light-mode {
      background: #f3faf4;
      color: #1f2b21;
    }

    body.light-mode .container {
      background: #ffffff;
      color: #1f2b21;
    }

    body.light-mode button.price-button {
      background: #68b06a;
      color: #ffffff;
    }

    body.light-mode .dark-mode-toggle {
      background: #e0efe2;
      color: #1f2b21;
    }

    .socials {
      margin-top: 1rem;
      display: flex;
      justify-content: center;
      gap: 15px;
      flex-wrap: wrap;
    }

    .social-item {
      background: #2a2f2d;
      padding: 0.5rem 0.8rem;
      border-radius: 0.6rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.8rem;
      transition: background 0.2s;
    }

    .social-item:hover {
      background: #3a413f;
    }

    body.light-mode .social-item {
      background: #e0efe2;
    }

    .copy-msg {
      font-size: 0.7rem;
      color: #68b06a;
      display: none;
    }

    .bottom-image {
      margin-top: 15px;
      max-width: 120px;
      width: 100%;
      opacity: 0.9;
    }

    .format-selection {
      margin-top: 1rem;
      text-align: left;
      padding-left: 1rem;
    }

    .format-selection label {
      margin-right: 15px;
      cursor: pointer;
    }

    .format-selection input[type="radio"] {
      margin-right: 5px;
      vertical-align: middle;
    }
  </style>
</head>
